; driver-venus — Victron Venus OS driver configuration
; ====================================================
; This file ships with the package and contains every available setting
; with a safe default. DO NOT EDIT — create a config.ini instead and
; override only what you need. config.ini is gitignored and local to
; each install.
;
; Every key can also be set by an environment variable, which wins over
; both files (hub's docker-compose.yml `driver-venus:` block uses these):
;   [mqtt]  host/port/username/password  -> MQTT_HOST/_PORT/_USERNAME/_PASSWORD
;   [venus] host/port/portal_id          -> VENUS_MQTT_HOST/VENUS_MQTT_PORT/VENUS_PORTAL_ID

; The renewvan bus broker this driver publishes to.
[mqtt]
host = localhost
port = 1883
; username =
; password =

; The Venus OS device's own broker (Cerbo GX, or a Pi running Venus OS),
; subscribed to on N/<portal_id>/#. host and portal_id have no default and
; are required: the driver refuses to start without them.
[venus]
host =
port = 1883
; Venus OS portal ID. Cerbo GX: Settings > VRM online portal > VRM portal ID.
portal_id =
